name: Skill Audit
# Documented in README.md.
on:
  workflow_call:

jobs:
  audit:
    name: ha-integration conformance check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PineappleEmperor/ha-integration-ci
          ref: ${{ job.workflow_sha }}
          path: .ha-integration-ci
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: pip install --quiet pyyaml
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .ha-integration-ci/scripts/skill_audit.py --root .
      - run: python3 .ha-integration-ci/scripts/version_sync.py --root .

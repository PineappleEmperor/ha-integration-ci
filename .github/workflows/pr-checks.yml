name: PR Checks

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr:
    uses: PineappleEmperor/release-flow/.github/workflows/pr-checks.yml@91c33e48be6ff98c348ec71530d31e04fc6a53f4 # v1.0.0

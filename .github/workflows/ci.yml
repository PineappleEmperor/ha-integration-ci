name: CI
# Documented in README.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Ruff, format and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: >-
          uv pip install --system --quiet pyyaml ruff==0.16.9 pytest
          pytest-homeassistant-custom-component==0.13.373
          pylint==4.0.8 astroid==4.0.4
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests/ -q -p no:homeassistant
      - run: python scripts/version_sync.py --root .

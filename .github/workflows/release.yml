name: Create Release ZIP
# Documented in README.md.
on:
  workflow_call:

jobs:
  build:
    name: Auto release zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Set the manifest version from the tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'; then
            echo "::error::release tag '$RELEASE_TAG' is not a valid version"
            exit 1
          fi
          python3 - "$VERSION" <<'PY'
          import json, pathlib, sys

          version = sys.argv[1]
          manifest = next(pathlib.Path("custom_components").glob("*/manifest.json"))
          data = json.loads(manifest.read_text())
          data["version"] = version
          manifest.write_text(json.dumps(data, indent=2) + "\n")
          print(f"{manifest}: version={version}")
          PY

      - name: Is there a panel to build
        id: panel
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no frontend/ — nothing to rebuild"
          fi

      - if: steps.panel.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Rebuild the panel bundle if it is stale
        if: steps.panel.outputs.present == 'true'
        working-directory: frontend
        run: npm ci && npm run build

      - name: Say whether the committed bundle was stale
        if: steps.panel.outputs.present == 'true'
        run: |
          if git diff --quiet -- 'custom_components/*/panel/*.js'; then
            echo "::notice::committed panel bundle was already current"
          else
            echo "::warning::the committed panel bundle was stale; this release ships a fresh build. Run 'npm run build' in frontend/ and commit it."
          fi

      - name: Create ZIP file
        id: zip
        run: |
          DOMAIN=$(basename "$(dirname custom_components/*/manifest.json)")
          ASSET="$GITHUB_WORKSPACE/$DOMAIN.zip"
          (cd "custom_components/$DOMAIN" && zip -r "$ASSET" . -x '*/__pycache__/*' '*.pyc')
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET: ${{ steps.zip.outputs.asset }}
        run: gh release upload "$RELEASE_TAG" "$ASSET" --clobber

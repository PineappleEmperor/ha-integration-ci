name: Python Validate
# Documented in README.md.
on:
  workflow_call:

jobs:
  lint-and-type:
    name: Python validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements.test.txt
            pyproject.toml

      - name: Install
        run: |
          uv pip install --system homeassistant ruff==0.16.3 mypy==2.3.1
          [ -f requirements.test.txt ] && uv pip install --system -r requirements.test.txt || true

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy --config-file mypy.ini custom_components/

      - name: Pre-commit hooks
        if: hashFiles('.pre-commit-config.yaml') != ''
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          PREK_SKIP: no-commit-to-branch,ruff-check,ruff-format

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PineappleEmperor/ha-integration-ci
          ref: ${{ github.job_workflow_sha }}
          path: .ha-integration-ci
          persist-credentials: false

      - name: Pytest
        env:
          PYTHONPATH: .ha-integration-ci/pytest_plugins
        run: |
          if [ ! -d tests ]; then
            echo "::warning::no tests/ directory - quality_scale rules marked 'done' are unproven"
          elif [ ! -f requirements.test.txt ]; then
            echo "::error::tests/ exists but requirements.test.txt is missing"
            exit 1
          else
            pytest tests/ -q --timeout=9 -p ha_translations \
              --cov=custom_components --cov-report=json:coverage.json
            python .ha-integration-ci/scripts/coverage_gate.py --root . --report coverage.json
          fi
